services:
  mysql:
    image: mysql:8.0
    container_name: campus-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Debes definir MYSQL_ROOT_PASSWORD}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD:?Debes definir USERS_DB_PASSWORD}
      REQUESTS_DB_PASSWORD: ${REQUESTS_DB_PASSWORD:?Debes definir REQUESTS_DB_PASSWORD}
      RESERVATIONS_DB_PASSWORD: ${RESERVATIONS_DB_PASSWORD:?Debes definir RESERVATIONS_DB_PASSWORD}
      RESOURCES_DB_PASSWORD: ${RESOURCES_DB_PASSWORD:?Debes definir RESOURCES_DB_PASSWORD}
      EVENTS_DB_PASSWORD: ${EVENTS_DB_PASSWORD:?Debes definir EVENTS_DB_PASSWORD}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?Debes definir NOTIFICATIONS_DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./sql/migrations/002-role-interfaces.sql:/docker-entrypoint-initdb.d/zy-role-interfaces.sql:ro
      - ./sql/provision-users.sh:/docker-entrypoint-initdb.d/zz-app-users.sh:ro
      - ./sql/migrations:/migrations:ro
    # Ping por TCP (127.0.0.1): el servidor temporal que MySQL usa para inicializar un
    # volumen nuevo no acepta conexiones de red, así que no se reporta "healthy" hasta
    # que arranca el servidor real (DEF-03). start_period da margen a esa inicialización.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  users-service:
    build:
      context: ./services/users-service
      dockerfile: dockerfile
    container_name: campus-users-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: campus_users
      DB_PASSWORD: ${USERS_DB_PASSWORD:?Debes definir USERS_DB_PASSWORD}
      DB_NAME: users_db
      JWT_SECRET: ${JWT_SECRET:?Debes definir JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Debes definir JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      PORT: 3201
      SERVICE_URL: http://localhost:3201
    depends_on:
      mysql:
        condition: service_healthy

  requests-service:
    build:
      context: ./services/requests-service
      dockerfile: dockerfile
    container_name: campus-requests-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: campus_requests
      DB_PASSWORD: ${REQUESTS_DB_PASSWORD:?Debes definir REQUESTS_DB_PASSWORD}
      DB_NAME: requests_db
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Debes definir INTERNAL_API_TOKEN}
      JWT_SECRET: ${JWT_SECRET:?Debes definir JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      PORT: 3202
      SERVICE_URL: http://localhost:3202
    depends_on:
      mysql:
        condition: service_healthy

  reservations-service:
    build:
      context: ./services/reservations-service
      dockerfile: dockerfile
    container_name: campus-reservations-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: campus_reservations
      DB_PASSWORD: ${RESERVATIONS_DB_PASSWORD:?Debes definir RESERVATIONS_DB_PASSWORD}
      DB_NAME: reservations_db
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Debes definir INTERNAL_API_TOKEN}
      BUSINESS_HOURS_START: ${BUSINESS_HOURS_START:-08:00}
      BUSINESS_HOURS_END: ${BUSINESS_HOURS_END:-22:00}
      JWT_SECRET: ${JWT_SECRET:?Debes definir JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      PORT: 3203
      SERVICE_URL: http://localhost:3203
    depends_on:
      mysql:
        condition: service_healthy

  resources-service:
    build:
      context: ./services/resources-service
      dockerfile: dockerfile
    container_name: campus-resources-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: campus_resources
      DB_PASSWORD: ${RESOURCES_DB_PASSWORD:?Debes definir RESOURCES_DB_PASSWORD}
      DB_NAME: resources_db
      JWT_SECRET: ${JWT_SECRET:?Debes definir JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      PORT: 3204
      SERVICE_URL: http://localhost:3204
    depends_on:
      mysql:
        condition: service_healthy

  events-service:
    build:
      context: ./services/events-service
      dockerfile: dockerfile
    container_name: campus-events-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: campus_events
      DB_PASSWORD: ${EVENTS_DB_PASSWORD:?Debes definir EVENTS_DB_PASSWORD}
      DB_NAME: events_db
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Debes definir INTERNAL_API_TOKEN}
      JWT_SECRET: ${JWT_SECRET:?Debes definir JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      PORT: 3205
      SERVICE_URL: http://localhost:3205
    depends_on:
      mysql:
        condition: service_healthy

  notifications-service:
    build:
      context: ./services/notifications-service
      dockerfile: dockerfile
    container_name: campus-notifications-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: campus_notifications
      DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?Debes definir NOTIFICATIONS_DB_PASSWORD}
      DB_NAME: notifications_db
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Debes definir INTERNAL_API_TOKEN}
      JWT_SECRET: ${JWT_SECRET:?Debes definir JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      PORT: 3206
      SERVICE_URL: http://localhost:3206
    depends_on:
      mysql:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: dockerfile
    container_name: campus-gateway
    restart: unless-stopped
    ports:
      - "3200:3200"
    environment:
      PORT: 3200
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      USERS_SERVICE_URL: http://users-service:3201
      REQUESTS_SERVICE_URL: http://requests-service:3202
      RESERVATIONS_SERVICE_URL: http://reservations-service:3203
      RESOURCES_SERVICE_URL: http://resources-service:3204
      EVENTS_SERVICE_URL: http://events-service:3205
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:3206
    depends_on:
      users-service:
        condition: service_started
      requests-service:
        condition: service_started
      reservations-service:
        condition: service_started
      resources-service:
        condition: service_started
      events-service:
        condition: service_started
      notifications-service:
        condition: service_started
        
volumes:
  mysql_data:
